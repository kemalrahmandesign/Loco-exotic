name: Prepare media

# Re-encodes the Higgsfield-generated films with a keyframe every 4
# frames so scroll-scrubbing (currentTime seeks) is cheap, and commits
# them to media/ so they're served same-origin from Pages.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  encode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download and re-encode
        run: |
          set -euo pipefail
          mkdir -p media
          while read -r name url; do
            [ -z "${name:-}" ] && continue
            echo "== $name"
            curl -fsSL "$url" -o "/tmp/$name.src.mp4"
            ffmpeg -nostdin -y -i "/tmp/$name.src.mp4" -an \
              -c:v libx264 -preset slow -crf 21 -g 4 \
              -pix_fmt yuv420p -movflags +faststart \
              "media/$name.mp4"
          done < media/manifest.txt
          ls -la media

      - name: Download and optimize stills
        run: |
          set -euo pipefail
          while read -r name url; do
            [ -z "${name:-}" ] && continue
            echo "== $name"
            curl -fsSL "$url" -o "/tmp/$name.src"
            if [ "$name" = "gear" ]; then
              # Cutout: keep it 2048 wide (it gets zoomed ~3x, and a
              # small source is what pixelated the old one) but ship
              # WebP so alpha survives at a fraction of the PNG size.
              ffmpeg -nostdin -y -i "/tmp/$name.src" -c:v libwebp -q:v 82 "media/gear.webp"
              ffmpeg -nostdin -y -i "/tmp/$name.src" -vf scale=1200:-1 "media/gear.png"
            else
              # Posters only show before a film decodes — 1280 JPEG is plenty.
              ffmpeg -nostdin -y -i "/tmp/$name.src" -vf scale=1280:-1 -q:v 4 "media/$name.jpg"
            fi
          done < media/images.txt
          rm -f media/hero-poster.png media/lift-poster.png
          ls -la media

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add media
          git commit -m "Re-encode scrub films with dense keyframes" || echo "nothing to commit"
          git push
